<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Navix">
  <!--
    Brauzer yorlig'i (favicon) va PWA ikonkasi.

    ── Nima uchun SVG ────────────────────────────────────────────────
    Yorliq 16px, xatcho'p 32px, Android ekrani esa 192px talab qiladi.
    SVG bitta fayl bo'lib, uchalasida ham aniq chiziladi.

    ── Nima uchun ranglar qotirilgan ─────────────────────────────────
    Boshqa joyda ranglar mavzuga qarab o'zgaradi. Bu yerda esa
    o'zgarmaydi: brauzer yorlig'i va telefon ekranidagi ikonka doim
    bir xil ko'rinishi kerak, aks holda foydalanuvchi uni tanimaydi.
    Qiymatlar `globals.css` dagi brend ranglari bilan bir xil.
    (Izohda CSS o'zgaruvchisining to'liq nomi yozilmadi: SVG izohi
    ichida ketma-ket ikkita chiziqcha bo'lishi mumkin emas.)

    ── Nima uchun belgi KATTAROQ ─────────────────────────────────────
    Ilova ichida belgi atrofida bo'sh joy bor. 16px'da esa bo'sh joy
    belgini ko'rinmas qilib qo'yadi, shuning uchun bu yerda u
    doirani to'laroq egallaydi.
  -->
  <defs>
    <linearGradient id="navix-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#314DF5" />
      <stop offset="1" stop-color="#A161E0" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#navix-brand)" />

  <!--
    Belgi 24×24 to'rda chizilgan va shu yerda 512 ga kattalashtiriladi.

    Siljitish qiymatlari (13.6 va 9.75) — belgining haqiqiy o'rtasi.
    Ular to'rning o'rtasi (12 va 12) emas: belgi to'rda simmetrik
    joylashmagan, uchqunlar o'ng tomonda. To'r markazi olinsa, belgi
    doiradan chiqib ketardi.
  -->
  <g transform="translate(256 256) scale(19) translate(-13.6 -9.75)" fill="#FCFCFE">
    <!-- "N" — bitta uzluksiz chiziq. -->
    <path
      d="M6.4 18.1V8.2L14 18.1v-7.2"
      fill="none"
      stroke="#FCFCFE"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Katta uchqun. -->
    <path d="M16.6 3.9c0 2.325-.775 3.1-3.1 3.1 2.325 0 3.1.775 3.1 3.1 0-2.325.775-3.1 3.1-3.1-2.325 0-3.1-.775-3.1-3.1Z" />
    <!-- O'rtacha uchqun. -->
    <path d="M20.2 2c0 1.425-.475 1.9-1.9 1.9 1.425 0 1.9.475 1.9 1.9 0-1.425.475-1.9 1.9-1.9-1.425 0-1.9-.475-1.9-1.9Z" />
    <!-- Kichik uchqun. -->
    <path d="M20.4 9c0 1.2-.4 1.6-1.6 1.6 1.2 0 1.6.4 1.6 1.6 0-1.2.4-1.6 1.6-1.6-1.2 0-1.6-.4-1.6-1.6Z" />
  </g>
</svg>
